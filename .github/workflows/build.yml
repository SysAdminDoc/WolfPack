name: Build LibreWolf Portable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'LibreWolf version (leave empty for latest)'
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if ($inputVersion) {
            $ver = $inputVersion
          } elseif ("${{ github.event.release.tag_name }}") {
            $ver = "${{ github.event.release.tag_name }}"
          } else {
            $release = Invoke-RestMethod -Uri "https://gitlab.com/api/v4/projects/44042130/releases/permalink/latest"
            $ver = $release.tag_name
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Using LibreWolf version: $ver"

      - name: Build portable package
        shell: pwsh
        run: |
          .\build-portable.ps1 -Version "${{ steps.version.outputs.VERSION }}" -Arch "${{ matrix.arch }}"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $sourceDir = "build\portable-$ver"
          $outFile = "output\LibreWolf-$ver-setup.exe"
          makensis /DVERSION="$ver" /DSOURCE_DIR="$sourceDir" /DOUTPUT_FILE="$outFile" installer.nsi

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: LibreWolf-${{ steps.version.outputs.VERSION }}-portable
          path: output/*-portable.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LibreWolf-${{ steps.version.outputs.VERSION }}-setup
          path: output/*-setup.exe

      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        run: |
          for file in output/*; do
            gh release upload "${{ github.event.release.tag_name }}" "$file" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
